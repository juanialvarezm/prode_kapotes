name: CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r back/requirements.txt

      - name: Run tests (si tenés)
        run: pytest || echo "No tests yet"

      - name: Lint (opcional)
        run: echo "Podés agregar flake8 acá"